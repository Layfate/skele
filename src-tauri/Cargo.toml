[package]
name = "skele"
version = "0.2.3"
description = "Skele: a calm, local-first workspace for notes, tasks, projects and databases"
authors = ["Skele contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "skele_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# SQLite is compiled in ("bundled"), so no platform needs a system SQLite library.
rusqlite = { version = "0.37", features = ["bundled"] }
# Local AI (Ollama) and MCP connection tests. The same reqwest/rustls build the updater
# already uses, so no extra TLS stack is compiled in.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["time"] }
# Images pasted into AI chats are decoded to files for Codex (`--image`).
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# Stopping an AI run signals its process group directly (killpg), not via the `kill` program.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Free Spotify accounts: play/pause/skip the Spotify app through Windows' media controls.
[target.'cfg(windows)'.dependencies]
# AI chat: Alt+V reads an image from the clipboard (Win32 clipboard).
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
